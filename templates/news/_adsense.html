{% comment %}
Manual AdSense unit. Pass `slot`. Optional: format (auto|rectangle), variant (css class).
Renders nothing when client or slot is missing — Auto ads still load from base.html.
{% endcomment %}
{% if adsense_client and slot %}
  <div class="ad-slot ad-slot-{{ variant|default:'infeed' }}" aria-label="Advertisement">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="{{ adsense_client }}"
         data-ad-slot="{{ slot }}"
         data-ad-format="{{ format|default:'auto' }}"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>
{% endif %}
